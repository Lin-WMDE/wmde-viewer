# viewer-core - image IO and data layer: decoding, EXIF, resizing, the
# thumbnail/full-image cache, and directory scanning. Owns everything between
# the filesystem and an in-memory decoded image; no widgets or app state.
[package]
version.workspace = true
name = "viewer-core"
description.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
libcosmic.workspace = true
fast_image_resize.workspace = true
image.workspace = true
kamadak-exif.workspace = true
libheif-rs.workspace = true
lru.workspace = true
rayon.workspace = true
resvg.workspace = true
# WMDE: the temporary file behind save_image; already in the graph through other crates.
tempfile = "3.27.0"
# WMDE: set_wallpaper. The data directory a written wallpaper lives in, and the background
# settings from wmde-bg's own crate, by path: it is upstream's cosmic-bg-config renamed, and
# [patch] cannot rename a crate.
dirs = "6.0.0"
wmde-bg-config = { path = "../../wmde-bg/config" }
# WMDE: JPEG XL in its own depth through the `image` crate, as wmde-bg reads it; already in the
# graph through zune-image.
jxl-oxide = { version = "0.12.6", features = ["image"] }
turbojpeg.workspace = true
zune-image.workspace = true

viewer-config = { path = "../viewer-config" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
